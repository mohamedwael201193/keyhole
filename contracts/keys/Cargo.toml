[package]
name = "keyhole-keys"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Sandbox fault injection ONLY; never a release/deploy artifact.
callback-failure-fixture = []
# Shrinks the upgrade timelock and the disbursement window to 30s for the sandbox fixture.
# contracts/keys/build.sh refuses this feature, and a release build also sets cfg keyhole_release,
# which fails compilation if this feature is on.
sandbox-short-delay = []

[dependencies]
near-sdk = { version = "~5.17", features = ["unstable"] }
near-contract-standards = "~5.17"

[dev-dependencies]
ed25519-dalek = "2.2"
near-sdk = { version = "~5.17", features = ["unit-testing"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(keyhole_release)"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
