[package]
name = "keyhole-keys-sandbox"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

# Sandbox (near-workspaces) tests for contracts/keys: v1 -> v2 upgrade + migrate,
# NEP-178, one key per account, NEP-199 sale with real balances.
[dev-dependencies]
near-workspaces = "0.22"
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"

keyhole-keys = { path = "../keys" }
near-sdk = { version = "~5.17", features = ["unit-testing"] }
ed25519-dalek = "2.2"
base64 = "0.22"

keyhole-worker = { path = "../../tee/worker" }
