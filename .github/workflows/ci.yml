name: ci
on:
  push:
    branches: [main]
  pull_request:
# Runs on the owner's self-hosted runner. Only pushes and same-repo PRs run; fork PRs are skipped and there is no pull_request_target.
permissions:
  contents: read
jobs:
  contract:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: contracts/keys } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - run: cargo test --locked
      - name: count passing tests
        run: cargo test --locked 2>&1 | awk '/^test result:/{s+=$4} END{print "| %s | " s+0 " |"}' | sed "s/%s/$(basename $PWD)/" >> "$GITHUB_STEP_SUMMARY"
      # deployed code is frozen; this one style lint is allowed so CI checks the exact deployed source
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::manual_range_contains
      - name: deployed wasm matches on-chain code_hash
        working-directory: .
        run: ./judge/1-contract.sh
  worker:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: tee/worker } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - run: cargo test --locked
      - name: count passing tests
        run: cargo test --locked 2>&1 | awk '/^test result:/{s+=$4} END{print "| %s | " s+0 " |"}' | sed "s/%s/$(basename $PWD)/" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: reproducible wasm, compared with the deployed hash
        run: |
          got=$(./build.sh)
          want=$(tr -d '[:space:]' < DEPLOYED_SHA256)
          echo "built    $got"
          echo "deployed $want"
          if [ "$got" != "$want" ]; then
            echo "::warning title=worker source is ahead of the enclave::Redeploy this wasm, then set DEPLOYED_SHA256 to $got. Until then verify.sh --rebuild will not match live attestations."
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: key log verifier
        run: node verify-log.mjs --self-test
      - name: deployed bytes on FastFS match
        run: test "$(curl -fsS https://main.fastfs.io/keyhole-devmo.near/outlayer.near/$(cat DEPLOYED_SHA256).wasm | sha256sum | cut -d' ' -f1)" = "$(cat DEPLOYED_SHA256)"
  cli:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: set -o pipefail; npm test 2>&1 | tee /tmp/c.txt
      - run: echo "| cli | $(awk '/^# pass/{print $3}' /tmp/c.txt) |" >> "$GITHUB_STEP_SUMMARY"
  judge-kit:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: ./judge/2-attestations.sh
      - run: ./verify.sh "$(jq -r '.[0].call_id' judge/evidence.json)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: claims.json file checks (paths, named tests, constants, committed wasm)
        run: node judge/verify-claims.mjs --offline
  hygiene:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # docs/evidence/oneclick-sol holds 1Click's own public quote signatures (ed25519:…), kept so the quotes stay verifiable
      - name: no secrets or keys committed
        run: |
          ! git grep -nE 'wk_[0-9a-f]{16}|ed25519:[1-9A-HJ-NP-Za-km-z]{80,}|eyJhbGci[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE' -- . ':!cli/package-lock.json' ':!docs/evidence/oneclick-sol/*.json'
  web:
    runs-on: [self-hosted, keyhole-box]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=json --outputFile=/tmp/v.json
      - run: echo "| web-unit | $(node -p "require('/tmp/v.json').numPassedTests") |" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      # system libraries are preinstalled on the runner (its apt mirror is not reachable)
      - run: npx playwright install chromium
      - name: e2e against the local production build (reads mainnet live)
        run: |
          npx next start -p 3100 & npx -y wait-on http://localhost:3100
          PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/p.json npx playwright test --grep-invert "funded payment key" --reporter=list,json
          echo "| e2e (distinct, each run at 2 widths) | $(node -p "const j=require('/tmp/p.json');new Set(j.suites.flatMap(function f(s){return [...(s.specs||[]).filter(x=>x.ok).map(x=>x.file+x.title),...(s.suites||[]).flatMap(f)]})).size") |" >> "$GITHUB_STEP_SUMMARY"
