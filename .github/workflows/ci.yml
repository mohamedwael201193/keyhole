name: ci
on:
  push:
    branches: [main, feat/worker-pledge-admission, feat/pledge-first-class, feat/pledge-two-sided]
  pull_request:
# Runs on GitHub-hosted runners. Only pushes and same-repo PRs run; fork PRs are skipped and there is no pull_request_target.
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: contracts/keys } }
    # Retain the historical release toolchain home; build.sh remaps crate/registry paths
    # and omits optional embedded ABI while still generating off-chain ABI JSON.
    env:
      CARGO_HOME: /home/box/.cargo
    steps:
      - uses: actions/checkout@v4
      - name: toolchain under the release CARGO_HOME + cargo-near 0.22.0
        working-directory: .
        run: |
          sudo mkdir -p /home/box && sudo chown "$(id -u):$(id -g)" /home/box
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none --profile minimal
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
          cargo near --version
      - run: rustup show && rustup component add clippy
      - name: unit tests
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/keys-unit.txt"
      - name: count passing tests
        run: awk '/^test result:/{s+=$4} END{print "| %s | " s+0 " |"}' "$RUNNER_TEMP/keys-unit.txt" | sed "s/%s/$(basename "$PWD")/" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo clippy --locked --all-targets -- -D warnings -A clippy::manual_range_contains
      - name: source rebuilds to the committed v2.5 release wasm
        run: |
          (cd release && sha256sum -c SHA256SUMS)
          ./build.sh >/dev/null
          got=$(sha256sum target/near/keyhole_keys.wasm | cut -d' ' -f1)
          want=$(grep ' v2.5/' release/SHA256SUMS | cut -d' ' -f1)
          echo "built $got"; echo "want  $want"; [ "$got" = "$want" ]
      - name: build sandbox-only callback failure fixture (never deploy)
        run: |
          ./build.sh --features callback-failure-fixture >/dev/null
          cp target/near/keyhole_keys.wasm ../keys-sandbox/tests/fixtures/callback_failure.wasm
      - name: source rebuilds the labelled custody mock fixture
        working-directory: contracts/keys-sandbox
        run: |
          ./build-policy-mock.sh
          git diff --exit-code -- tests/fixtures/custody_policy_mock.wasm
      - name: sandbox (near-workspaces) v1 -> v2 upgrade + migrate through v2.5 code-only (admission barrier + sealed pledge state), NEP-178 cap, one key, royalty sale, minter-only tier raise
        working-directory: contracts/keys-sandbox
        run: |
          set -o pipefail
          CARGO_INCREMENTAL=0 cargo test --locked -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/sandbox.txt"
      - name: count passing sandbox tests
        working-directory: contracts/keys-sandbox
        run: awk '/^test result:/{s+=$4} END{print "| %s | " s+0 " |"}' "$RUNNER_TEMP/sandbox.txt" | sed "s/%s/$(basename "$PWD")/" >> "$GITHUB_STEP_SUMMARY"
      - name: deployed wasm matches on-chain code_hash
        working-directory: .
        run: ./judge/1-contract.sh
  worker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: tee/worker } }
    steps:
      - uses: actions/checkout@v4
      - run: rustup show && rustup component add clippy
      - name: unit tests
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee "$RUNNER_TEMP/worker-unit.txt"
      - name: count passing tests
        run: awk '/^test result:/{s+=$4} END{print "| %s | " s+0 " |"}' "$RUNNER_TEMP/worker-unit.txt" | sed "s/%s/$(basename "$PWD")/" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: lint the WASI-only custody host (native cfg excludes it)
        run: cargo clippy --locked --target wasm32-wasip2 -- -D warnings
      - name: reproducible wasm, compared with the deployed hash
        run: |
          got=$(./build.sh)
          want=$(tr -d '[:space:]' < DEPLOYED_SHA256)
          echo "built    $got"
          echo "deployed $want"
          if [ "$got" != "$want" ]; then
            echo "::warning title=worker source is ahead of the enclave::Redeploy this wasm, then set DEPLOYED_SHA256 to $got. Until then verify.sh --rebuild will not match live attestations."
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: key log verifier
        run: node verify-log.mjs --self-test
      - name: deployed bytes on FastFS match
        run: test "$(curl -fsS https://main.fastfs.io/keyhole-devmo.near/outlayer.near/$(cat DEPLOYED_SHA256).wasm | sha256sum | cut -d' ' -f1)" = "$(cat DEPLOYED_SHA256)"
  cli:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: set -o pipefail; npm test 2>&1 | tee "$RUNNER_TEMP/c.txt"
      - run: echo "| cli | $(awk '/^# pass/{print $3}' "$RUNNER_TEMP/c.txt") |" >> "$GITHUB_STEP_SUMMARY"
  judge-kit:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: zero-install live path (curl + python3; code hash, views, one attestation, one receipt)
        run: ./judge/0-live.sh
      - run: ./judge/2-attestations.sh
      - run: ./verify.sh "$(jq -r '.[0].call_id' judge/evidence.json)"
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: identity.json is the single source of build identities (generated files in sync, wasm sha + base58 code hash agree)
        run: node scripts/gen-identity.mjs --check
      - name: claims.json regenerates from current documentation
        run: |
          python3 judge/gen-claims.py .
          git diff --exit-code -- docs/claims.json
      - name: transaction receipt proof checker regression tests
        run: node --test judge/tx-outcome.test.mjs
      - name: strict recorded-refusal predicate
        run: python3 judge/receipt_proof_test.py
      - name: primary judge checkout command
        run: node --test judge/checkout-command.test.mjs
      - name: default claims mode does not spend on health
        run: node --test judge/passive-claims.test.mjs
      - name: claims.json file checks (paths, named tests, constants, committed wasm)
        run: node judge/verify-claims.mjs --offline
  hygiene:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      # docs/evidence/oneclick-sol holds 1Click's own public quote signatures (ed25519:…), kept so the quotes stay verifiable
      - name: no secrets or keys committed
        run: |
          ! git grep -nE 'wk_[0-9a-f]{16}|ed25519:[1-9A-HJ-NP-Za-km-z]{80,}|eyJhbGci[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE' -- . ':!cli/package-lock.json' ':!docs/evidence/oneclick-sol/*.json'
      - name: source tarball identity matches identity.json (worker wasm + contract code hash)
        run: |
          python3 - <<'PY'
          import json, gzip, io, tarfile
          from pathlib import Path
          live = json.loads(Path("identity.json").read_text())
          man = json.loads(Path("web/public/source/manifest.json").read_text())
          raw = gzip.open("web/public/source/keyhole-src.tar.gz", "rb").read()
          tf = tarfile.open(fileobj=io.BytesIO(raw))
          member = next(n for n in tf.getnames() if n.endswith("identity.json"))
          packed = json.loads(tf.extractfile(member).read())
          assert packed["worker"]["wasm_sha256"] == live["worker"]["wasm_sha256"], (packed["worker"]["wasm_sha256"], live["worker"]["wasm_sha256"])
          assert packed["contract"]["code_hash"] == live["contract"]["code_hash"], (packed["contract"]["code_hash"], live["contract"]["code_hash"])
          print(f"OK source@{man['commit'][:12]} worker={live['worker']['wasm_sha256'][:8]} contract={live['contract']['code_hash'][:8]}")
          PY
  web:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/v.json"
      - run: echo "| web-unit | $(node -p "require(process.env.RUNNER_TEMP+'/v.json').numPassedTests") |" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e against the local production build (reads mainnet live)
        run: |
          PORT="${KH_E2E_PORT:-3100}"; export BASE_URL="http://localhost:$PORT"
          npx next start -p "$PORT" & npx -y wait-on "$BASE_URL"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/p.json" npx playwright test --grep-invert "funded payment key" --reporter=list,json
          echo "| e2e (distinct, each run at 2 widths) | $(node -p "const j=require(process.env.RUNNER_TEMP+'/p.json');new Set(j.suites.flatMap(function f(s){return [...(s.specs||[]).filter(x=>x.ok).map(x=>x.file+x.title),...(s.suites||[]).flatMap(f)]})).size") |" >> "$GITHUB_STEP_SUMMARY"

      - name: Pledge borrower and lender viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pledge-shots
          path: web/test-results/pledge-shots
          if-no-files-found: ignore
          retention-days: 7

      - name: Real native sandbox / real UI funded repay and default endings
        env:
          PLEDGE_SANDBOX_E2E: "1"
          NEXT_PUBLIC_PLEDGE_SANDBOX: "1"
          NEXT_PUBLIC_PLEDGE_LIVE: "1"
          NEXT_PUBLIC_PLEDGE_TRANSACTIONS: "1"
          BASE_URL: http://127.0.0.1:3142
          PLEDGE_SHOTS: test-results/pledge-final
        run: |
          export UI_SANDBOX_READY="$RUNNER_TEMP/pledge-sandbox.json"
          (cd ../contracts/keys-sandbox && cargo test --locked --test pledge serve_ui_sandbox -- --ignored --nocapture > "$RUNNER_TEMP/pledge-sandbox.log" 2>&1) &
          node -e 'const fs=require("fs");let n=0;const t=setInterval(()=>{if(fs.existsSync(process.env.UI_SANDBOX_READY)){clearInterval(t);process.exit(0)}if(++n>900){clearInterval(t);process.exit(1)}},1000)'
          export NEXT_PUBLIC_PLEDGE_SANDBOX_RPC="$(node -p 'require(process.env.UI_SANDBOX_READY).rpc')"
          npm run build
          npx next start --hostname 127.0.0.1 -p 3142 > "$RUNNER_TEMP/pledge-ui.log" 2>&1 &
          node -e 'let n=0;const t=setInterval(async()=>{try{if((await fetch(process.env.BASE_URL+"/pledge?token=k1")).ok){clearInterval(t);process.exit(0)}}catch{}if(++n>180){clearInterval(t);process.exit(1)}},1000)'
          npx playwright test pledge-funded.spec.ts --project=desktop --workers=1 --retries=0
      - name: Funded Pledge final screenshots / native receipts / fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pledge-final
          path: |
            web/test-results/pledge-final
            ${{ runner.temp }}/pledge-sandbox.log
            ${{ runner.temp }}/pledge-ui.log
          if-no-files-found: warn
          retention-days: 7
