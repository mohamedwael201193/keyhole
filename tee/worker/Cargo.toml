[package]
name = "keyhole-worker"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "keyhole-worker"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.10"
sha3 = "0.10"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
bs58 = "0.5"
base64 = "0.22"
hex = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.36"
wasi-http-client = "0.2"
getrandom = "0.3"

[dev-dependencies]
ed25519-dalek = { version = "2.2", features = ["rand_core"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
